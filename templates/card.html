{% extends "base.html" %}
{% block title %}{{ card.title }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h3 class="card-title">{{ card.title }}</h3>
        <h4 class="card-subtitle text-muted">{{ card.subtitle }}</h4>
        <p class="card-text">{{ card.text }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Назад к списку</a>
    </div>
</div>
{% endblock %}
