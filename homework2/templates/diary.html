{% extends "index.html" %}

{% block content %}
<section class="notes-page">
    <h2>Дневник программиста</h2>

    <form action="{{ url_for('diary') }}" method="post" class="note-form">

        <label for="title">Заголовок записи:</label>
        <input type="text" id="title" name="title" placeholder="Например: первая ачивка" required>

        <label for="content">Текст записи:</label>
        <textarea id="content" name="content" rows="5" placeholder="Что сегодня получилось?" required></textarea>

        <button type="submit" class="btn-primary">Добавить запись</button>
    </form>

    <hr style="border: 0; border-top: 1px solid #ddd; margin: 30px 0;">


    <div class="notes-list">
        <h3>Мои записи</h3>
        
        {% if notes %}
            {% for note in notes %}
                <article class="note-item">
                    <h4>{{ note.title }}</h4>
                    <p>{{ note.text }}</p>
                </article>
            {% endfor %}
        {% else %}
            <p>Пока нет записей. Пиши, если что.</p>
        {% endif %}
    </div>
</section>
{% endblock %}
